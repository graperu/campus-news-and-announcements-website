name: Build initial AWS image
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run check && npm test
      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
              event_name: claims.event_name,
              environment: claims.environment
            }, null, 2));
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable image before creating ECS service
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_SHA"
          if aws ecr describe-images --repository-name "${REPOSITORY#*/}" --image-ids "imageTag=$TAG" > /dev/null 2>&1; then
            echo "Using existing immutable image tag: $TAG"
            exit 0
          fi
          docker build -f infra/docker/Dockerfile -t "$REPOSITORY:$TAG" .
          docker push "$REPOSITORY:$TAG"
          echo "Image ready: $REPOSITORY:$TAG" >> "$GITHUB_STEP_SUMMARY"
