name: Verify application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: ci-only-isolated-password
          POSTGRES_DB: campus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campus -d campus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://campus:ci-only-isolated-password@localhost:5432/campus_test
      - run: npx playwright install --with-deps chromium
      - name: Browser editorial workflow
        run: npm run test:workflow
        env:
          BROWSER_CHANNEL: chromium
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
      - name: Verify production container builds
        run: docker build -t campus-ci .
